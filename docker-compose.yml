# Optional backing services for the non-default profiles.
# The projects all run without these (in-memory stores/bus by default).
#   Project 1 with MongoDB:  mvn -pl project1-document-collaboration-engine spring-boot:run -Dspring-boot.run.profiles=mongo
#   Project 3 with Redis:    mvn -pl project3-notification-service spring-boot:run -Dspring-boot.run.profiles=redis
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  mongo-data:
