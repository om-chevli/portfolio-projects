name: build
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test all three projects
        run: mvn -B verify
  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Project 1 frontend typecheck
        working-directory: project1-document-collaboration-engine/frontend
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
      - name: Project 3 client typecheck
        working-directory: project3-notification-service/frontend
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
